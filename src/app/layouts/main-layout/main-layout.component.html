<div class="main-layout">
  <header class="app-header">
    <div class="header-content">
      <button class="menu-toggle" (click)="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <h1 class="app-title">NOVA STORE</h1>
      <div class="header-actions">
        <button class="cart-btn">🛒 Cart</button>
      </div>
    </div>
  </header>

  <div class="app-body">
    <app-drawer 
      [isOpen]="isMenuOpen" 
      [position]="'left'" 
      [hasOverlay]="true"
      [lockScroll]="true"
      (isOpenChange)="isMenuOpen = $event">
      <nav class="app-menu">
        <ul>
          <li><a routerLink="/" routerLinkActive="active">Home</a></li>
          <li><a routerLink="/catalog" routerLinkActive="active">Catalog</a></li>
          <li><a routerLink="/categories" routerLinkActive="active">Categories</a></li>
          <li><a routerLink="/brands" routerLinkActive="active">Brands</a></li>
          <li><a routerLink="/wishlist" routerLinkActive="active">Wishlist</a></li>
          <li><a routerLink="/cart" routerLinkActive="active">Cart</a></li>
          <li><a routerLink="/account" routerLinkActive="active">Account</a></li>
          <li><a routerLink="/about" routerLinkActive="active">About</a></li>
          <li><a routerLink="/contacts" routerLinkActive="active">Contact</a></li>
          <li><a routerLink="/search" routerLinkActive="active">Search</a></li>
        </ul>
      </nav>
    </app-drawer>

    <main class="app-main">
      <app-breadcrumbs></app-breadcrumbs>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
