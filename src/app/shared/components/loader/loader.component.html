<div class="loader" [ngClass]="type">
  <div class="loader-content" [ngClass]="{ 'animated': animated }">
    <ng-container *ngIf="type === 'spinner'">
      <div class="loader-spinner" [ngClass]="size">
        <div class="loader-spinner__circle"></div>
        <div class="loader-spinner__circle loader-spinner__circle--2"></div>
        <div class="loader-spinner__circle loader-spinner__circle--3"></div>
      </div>
    </ng-container>

    <ng-container *ngIf="type === 'bar'">
      <div class="loader-bar" [ngClass]="size">
        <div class="loader-bar__fill"></div>
      </div>
    </ng-container>
  </div>
</div>
