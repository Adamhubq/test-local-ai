<div class="ns-textarea-wrapper">
  <label 
    *ngIf="label" 
    [for]="textareaId"
    class="ns-textarea__label"
  >
    {{ label }}
    <span *ngIf="required" class="ns-textarea__required">*</span>
  </label>

  <div class="ns-textarea__container">
    <textarea
      [id]="textareaId"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [required]="required"
      [rows]="rows"
      [value]="value"
      (input)="onInputChange($event)"
      (blur)="onBlur()"
      class="ns-textarea__field"
      [class.ns-textarea__field--error]="!!error"
      [class.ns-textarea__field--disabled]="disabled"
    ></textarea>
  </div>

  <div *ngIf="hint" class="ns-textarea__hint">
    {{ hint }}
  </div>

  <div *ngIf="error" class="ns-textarea__error">
    {{ error }}
  </div>
