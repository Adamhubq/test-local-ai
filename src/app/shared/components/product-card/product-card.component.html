<div class="product-card">
  <!-- Product Image -->
  <div class="product-image-container">
    <img
      *ngIf="hasImage; else noImage"
      [src]="product.image"
      [alt]="product.name"
      class="product-image">

    <ng-template #noImage>
      <div class="product-image-placeholder">
        <span class="placeholder-text">No Image</span>
      </div>
    </ng-template>

    <!-- Favorite Button -->
    <button
      class="favorite-btn"
      (click)="onToggleFavorite()"
      [class.favorite]="false"
      aria-label="Add to favorites">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
      </svg>
    </button>

    <!-- Discount Badge -->
    <div *ngIf="discountPercentage && discountPercentage > 0" class="discount-badge">
      {{ discountPercentage }}% OFF
    </div>
  </div>

  <!-- Product Info -->
  <div class="product-info">
    <!-- Brand -->
    <div class="product-brand">{{ product.category }}</div>

    <!-- Name -->
    <h3 class="product-name">{{ product.name }}</h3>

    <!-- Rating -->
    <div *ngIf="hasRating" class="product-rating">
      <span class="rating-value">{{ product.rating }}</span>
      <div class="stars">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26"></polygon>
        </svg>
      </div>
    </div>

    <!-- Prices -->
    <div class="product-prices">
      <span class="current-price">${{ product.price }}</span>
      <!-- Old Price (if applicable) -->
      <span *ngIf="discountPercentage && discountPercentage > 0" class="old-price">${{ product.price * 1.2 }}</span>
    </div>

    <!-- Action Buttons -->
    <div class="product-actions">
      <button
        class="add-to-cart-btn"
        [disabled]="!product.inStock"
        (click)="onAddToCart()">
        {{ product.inStock ? 'Add to Cart' : 'Out of Stock' }}
      </button>
    </div>
  </div>
</div>
