<header class="app-header">
  <div class="header-content">
    <h1 class="app-title">NOVA STORE</h1>
    <div class="header-menu-wrapper" (keydown)="handleKeyboardEvent($event)" tabindex="0">
      <app-menu></app-menu>
      <div class="cursor-indicator" [style.left.px]="getCursorLeft()"></div>
    </div>
    <div class="header-actions">
      <button class="cart-btn" (click)="goToCart()">
        🛒 Cart ({{ cart.totalItems }})
      </button>
      <button class="search-btn" (click)="search('')">
        🔍 Search
      </button>
    </div>
  </div>
</header>
