<div class="ns-select-wrapper">
  <label 
    *ngIf="label" 
    [for]="id || 'select-' + (Math.random() | number)"
    class="ns-select__label"
  >
    {{ label }}
    <span *ngIf="required" class="ns-select__required">*</span>
  </label>

  <div class="ns-select__container">
    <select
      [id]="id || 'select-' + (Math.random() | number)"
      [disabled]="disabled"
      [required]="required"
      [value]="value"
      (change)="onSelectChange($event)"
      (keydown)="onKeydown($event)"
      class="ns-select__field"
      [class.ns-select__field--error]="!!error"
      [class.ns-select__field--disabled]="disabled"
    >
      <option *ngFor="let option of options" [value]="option.value">
        {{ option.label }}
      </option>
    </select>
    <span class="ns-select__arrow" aria-hidden="true"></span>
  </div>

  <div *ngIf="hint" class="ns-select__hint">
    {{ hint }}
  </div>

  <div *ngIf="error" class="ns-select__error">
    {{ error }}
  </div>
