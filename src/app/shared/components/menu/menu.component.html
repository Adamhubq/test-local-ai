<nav class="app-menu">
  <ul class="menu-list">
    <li class="menu-item" 
        *ngFor="let item of menuItems; let i = index"
        (click)="onMenuItemClick(i)"
        tabindex="0"
        [attr.aria-label]="'Перейти к ' + item.label">
      <a href="#" (click)="$event.preventDefault(); onMenuItemClick(i)">
        {{item.label}}
      </a>
    </li>
  </ul>
</nav>
