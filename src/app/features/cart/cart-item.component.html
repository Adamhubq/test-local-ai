<div class="cart-item">
  <div class="item-image">
    <img [src]="item.product.image" [alt]="item.product.name" />
  </div>
  
  <div class="item-details">
    <h3 class="item-name">{{ item.product.name }}</h3>
    <p class="item-price">{{ item.product.price | number }} ₽</p>
    
    <div class="quantity-control">
      <button class="quantity-btn" (click)="onQuantityChange(item.quantity - 1)" [disabled]="item.quantity <= 1">-</button>
      <span class="quantity">{{ item.quantity }}</span>
      <button class="quantity-btn" (click)="onQuantityChange(item.quantity + 1)">+</button>
    </div>
  </div>
  
  <div class="item-total">
    <p class="total-price">{{ (item.product.price * item.quantity) | number }} ₽</p>
    <button class="remove-btn" (click)="removeItemFromCart()">Удалить</button>
  </div>
