<div class="cart-page">
  <div class="cart-header">
    <h1>Корзина</h1>
  </div>
  
  <div class="cart-content">
    <div class="cart-items">
      <!-- Список товаров в корзине будет здесь -->
      <div class="empty-cart" *ngIf="!hasItems">
        <p>Ваша корзина пуста</p>
      </div>
      
      <div class="cart-item" *ngFor="let item of cartItems">
        <!-- Элементы корзины будут здесь -->
        <app-product-card [product]="item.product"></app-product-card>
      </div>
    </div>
    
    <div class="cart-summary">
      <div class="summary-total">
        <h3>Итого: <span class="total-amount">0 ₽</span></h3>
      </div>
      
      <div class="summary-actions">
        <button class="btn btn-secondary" (click)="continueShopping()">Продолжить покупки</button>
        <button class="btn btn-primary" (click)="proceedToCheckout()">Оформить заказ</button>
      </div>
    </div>
  </div>
