<div class="cart-container">
  <h2>Shopping Cart</h2>
  
  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>Your cart is empty</p>
  </div>

  <div *ngIf="cartItems.length > 0" class="cart-content">
    <div class="cart-items">
      <div *ngFor="let item of cartItems" class="cart-item">
        <div class="item-info">
          <h3>{{ item.product.name }}</h3>
          <p>{{ item.product.description }}</p>
        </div>
        <div class="item-quantity">
          <button (click)="updateQuantity(item.product.id, item.quantity - 1)">-</button>
          <span>{{ item.quantity }}</span>
          <button (click)="updateQuantity(item.product.id, item.quantity + 1)">+</button>
        </div>
        <div class="item-price">
          <p>{{ item.product.price * item.quantity | currency }}</p>
        </div>
        <div class="item-actions">
          <button (click)="removeFromCart(item.product.id)" class="remove-btn">Remove</button>
        </div>
      </div>
    </div>

    <div class="cart-summary">
      <h3>Order Summary</h3>
      <div class="summary-row">
        <span>Subtotal:</span>
        <span>{{ total | currency }}</span>
      </div>
      <div class="summary-row">
        <span>Shipping:</span>
        <span>Free</span>
      </div>
      <div class="summary-row total">
        <span>Total:</span>
        <span>{{ total | currency }}</span>
      </div>
      <button (click)="clearCart()" class="clear-btn">Clear Cart</button>
      <button routerLink="/checkout" class="checkout-btn">Proceed to Checkout</button>
    </div>
  </div>
</div>
